services:
  backend:
    build:
      context: ./BackendTikKun
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: ./.env.development
        required: false
    environment:
      NODE_ENV: development
      PORT: "3000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      RUN_MIGRATIONS: "false"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./BackendTikKun/src:/app/src
      - ./BackendTikKun/prisma:/app/prisma
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/cabins').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./FrontendTikKun
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: ./FrontendTikKun/.env
        required: false
      - path: ./.env.development
        required: false
    environment:
      VITE_AUTH_API_BASE_URL: ${VITE_AUTH_API_BASE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./FrontendTikKun/src:/app/src
      - ./FrontendTikKun/public:/app/public
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
